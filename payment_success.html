<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Payment Successful</title>
</head>
<body style="font-family: Arial, sans-serif; background-color: #f3f4f6; padding: 20px;">

    <div style="max-width: 600px; margin: auto; background: white; padding: 25px; border-radius: 12px;">
        <h2 style="color: #16a34a;">Payment Successful</h2>

        <p>Hello {{ user_name }},</p>

        <p>
            Your payment has been completed successfully.
        </p>

        <table style="width: 100%; border-collapse: collapse; margin-top: 20px;">
            <tr>
                <td style="padding: 10px; border-bottom: 1px solid #e5e7eb;"><strong>Invoice Number</strong></td>
                <td style="padding: 10px; border-bottom: 1px solid #e5e7eb;">{{ invoice_number }}</td>
            </tr>

            <tr>
                <td style="padding: 10px; border-bottom: 1px solid #e5e7eb;"><strong>Transaction ID</strong></td>
                <td style="padding: 10px; border-bottom: 1px solid #e5e7eb;">{{ transaction_id }}</td>
            </tr>

            <tr>
                <td style="padding: 10px; border-bottom: 1px solid #e5e7eb;"><strong>Amount Paid</strong></td>
                <td style="padding: 10px; border-bottom: 1px solid #e5e7eb;">₹{{ amount_paid }}</td>
            </tr>

            <tr>
                <td style="padding: 10px;"><strong>Status</strong></td>
                <td style="padding: 10px; color: #16a34a;"><strong>Success</strong></td>
            </tr>
        </table>

        <p style="margin-top: 20px;">
            Thank you for your payment.
        </p>

        <p>Regards,<br>SaaS Billing Portal Team</p>
    </div>

</body>
</html>
