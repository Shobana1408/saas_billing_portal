{% extends "base.html" %}

{% block content %}

<div class="admin-container">
    <h1 class="admin-title">System Settings</h1>

    <div class="admin-card">
        <form method="POST" action="{{ url_for('admin.settings') }}">
            <div class="form-group">
                <label for="site_name">Site Name</label>
                <input type="text" name="site_name" id="site_name" class="form-control" value="SaaS Billing Portal">
            </div>

            <div class="form-group">
                <label for="admin_email">Admin Email</label>
                <input type="email" name="admin_email" id="admin_email" class="form-control" value="admin@saasportal.com">
            </div>

            <div class="form-group">
                <label for="default_currency">Default Currency</label>
                <select name="default_currency" id="default_currency" class="form-control">
                    <option value="INR">Indian Rupee</option>
                    <option value="USD">US Dollar</option>
                    <option value="EUR">Euro</option>
                </select>
            </div>

            <div class="form-group">
                <label for="maintenance_mode">Maintenance Mode</label>
                <select name="maintenance_mode" id="maintenance_mode" class="form-control">
                    <option value="off">Off</option>
                    <option value="on">On</option>
                </select>
            </div>

            <button type="submit" class="btn">Save Settings</button>
        </form>
    </div>
</div>

{% endblock %}
