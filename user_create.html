{% extends "base.html" %}

{% block content %}

<div class="admin-container">
    <div class="dashboard-hero">
        <div>
            <span class="dashboard-badge">Create User</span>
            <h1>Add New User</h1>
            <p>Create a new user account and assign role-based access.</p>
        </div>

        <div class="dashboard-hero-actions">
            <a href="{{ url_for('users.user_list') }}" class="btn">Back to Users</a>
        </div>
    </div>

    <div class="admin-card">
        <form method="POST" action="{{ url_for('users.create_user') }}">
            <div class="form-grid">
                <div class="form-group">
                    <label for="full_name">Full Name</label>
                    <input 
                        type="text" 
                        name="full_name" 
                        id="full_name" 
                        class="form-control" 
                        placeholder="Enter full name"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input 
                        type="email" 
                        name="email" 
                        id="email" 
                        class="form-control" 
                        placeholder="Enter email"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input 
                        type="password" 
                        name="password" 
                        id="password" 
                        class="form-control" 
                        placeholder="Minimum 6 characters"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="role_id">Role</label>
                    <select name="role_id" id="role_id" class="form-control" required>
                        <option value="">Select Role</option>
                        {% for role in roles %}
                            <option value="{{ role[0] }}">{{ role[1] }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="form-group">
                    <label for="company_id">Company</label>
                    <select name="company_id" id="company_id" class="form-control">
                        <option value="">No Company</option>
                        {% for company in companies %}
                            <option value="{{ company[0] }}">{{ company[1] }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="form-group">
                    <label for="status">Status</label>
                    <select name="status" id="status" class="form-control" required>
                        <option value="active">Active</option>
                        <option value="inactive">Inactive</option>
                        <option value="blocked">Blocked</option>
                    </select>
                </div>
            </div>

            <button type="submit" class="btn">Create User</button>
            <a href="{{ url_for('users.user_list') }}" class="btn btn-danger">Cancel</a>
        </form>
    </div>
</div>

{% endblock %}
