{% extends "base.html" %}

{% block content %}

<div class="invoice-container">
    <div class="dashboard-hero">
        <div>
            <span class="dashboard-badge">Create Invoice</span>
            <h1>New Invoice</h1>
            <p>Generate a billing invoice for a company subscription.</p>
        </div>

        <div class="dashboard-hero-actions">
            <a href="{{ url_for('invoices.invoice_list') }}" class="btn">Back to Invoices</a>
        </div>
    </div>

    <div class="invoice-card">
        <form id="invoiceForm" method="POST" action="{{ url_for('invoices.invoice_create') }}">
            <div class="form-grid">
                <div class="form-group">
                    <label for="company_id">Company</label>
                    <select name="company_id" id="company_id" class="form-control" required>
                        <option value="">Select Company</option>
                        {% for company in companies %}
                            <option value="{{ company[0] }}">{{ company[1] }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="form-group">
                    <label for="subscription_id">Subscription</label>
                    <select name="subscription_id" id="subscription_id" class="form-control" required>
                        <option value="">Select Subscription</option>
                        {% for subscription in subscriptions %}
                            <option value="{{ subscription[0] }}">
                                #{{ subscription[0] }} - {{ subscription[1] }} - {{ subscription[2] }}
                            </option>
                        {% endfor %}
                    </select>
                </div>

                <div class="form-group">
                    <label for="invoice_number">Invoice Number</label>
                    <input 
                        type="text" 
                        name="invoice_number" 
                        id="invoice_number" 
                        class="form-control" 
                        placeholder="Example: INV-1004"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="amount">Amount</label>
                    <input 
                        type="number" 
                        name="amount" 
                        id="amount" 
                        class="form-control" 
                        step="0.01" 
                        min="0" 
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="tax">Tax</label>
                    <input 
                        type="number" 
                        name="tax" 
                        id="tax" 
                        class="form-control" 
                        step="0.01" 
                        min="0" 
                        value="0"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="total_amount">Total Amount</label>
                    <input 
                        type="number" 
                        name="total_amount" 
                        id="total_amount" 
                        class="form-control" 
                        step="0.01" 
                        min="0" 
                        readonly
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="due_date">Due Date</label>
                    <input 
                        type="date" 
                        name="due_date" 
                        id="due_date" 
                        class="form-control" 
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="status">Invoice Status</label>
                    <select name="status" id="status" class="form-control" required>
                        <option value="unpaid">Unpaid</option>
                        <option value="paid">Paid</option>
                        <option value="overdue">Overdue</option>
                    </select>
                </div>
            </div>

            <button type="submit" class="btn">Create Invoice</button>
            <a href="{{ url_for('invoices.invoice_list') }}" class="btn btn-danger">Cancel</a>
        </form>
    </div>
</div>

{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/invoices.js') }}"></script>
{% endblock %}
