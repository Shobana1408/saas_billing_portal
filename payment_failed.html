{% extends "base.html" %}

{% block content %}

<div class="billing-container">
    <h1 class="billing-title">Payment Failed</h1>

    <div class="billing-card" style="text-align: center;">
        <h2 style="color: #dc2626;">Payment Failed</h2>
        <p>Your payment could not be completed. Please check the payment details and try again.</p>

        <br>

        <a href="{{ url_for('billing.payment_create') }}" class="btn">Try Again</a>
        <a href="{{ url_for('billing.payment_history') }}" class="btn btn-danger">View Payment History</a>
    </div>
</div>

{% endblock %}
