{% extends "base.html" %}

{% block content %}

<div class="admin-container">
    <div class="dashboard-hero">
        <div>
            <span class="dashboard-badge">Create Plan</span>
            <h1>Add Subscription Plan</h1>
            <p>Create a new pricing plan with billing cycle, user limit, and included features.</p>
        </div>

        <div class="dashboard-hero-actions">
            <a href="{{ url_for('subscriptions.plans') }}" class="btn">Back to Plans</a>
        </div>
    </div>

    <div class="admin-card">
        <form method="POST" action="{{ url_for('subscriptions.create_plan') }}">
            <div class="form-grid">
                <div class="form-group">
                    <label for="plan_name">Plan Name</label>
                    <input 
                        type="text" 
                        name="plan_name" 
                        id="plan_name" 
                        class="form-control" 
                        placeholder="Basic, Pro, Enterprise"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="price">Price</label>
                    <input 
                        type="number" 
                        name="price" 
                        id="price" 
                        class="form-control" 
                        step="0.01"
                        min="0"
                        placeholder="9999"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="billing_cycle">Billing Cycle</label>
                    <select name="billing_cycle" id="billing_cycle" class="form-control" required>
                        <option value="monthly">Monthly</option>
                        <option value="yearly">Yearly</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="max_users">Maximum Users</label>
                    <input 
                        type="number" 
                        name="max_users" 
                        id="max_users" 
                        class="form-control" 
                        min="1"
                        placeholder="100"
                        required
                    >
                </div>

                <div class="form-group full-field">
                    <label for="features">Features</label>
                    <textarea 
                        name="features" 
                        id="features" 
                        class="form-control" 
                        placeholder="Analytics, invoice generation, AI insights, reports..."
                    ></textarea>
                </div>
            </div>

            <button type="submit" class="btn">Create Plan</button>
            <a href="{{ url_for('subscriptions.plans') }}" class="btn btn-danger">Cancel</a>
        </form>
    </div>
</div>

{% endblock %}
